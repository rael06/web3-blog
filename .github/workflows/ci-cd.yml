# Checks every push and pull request; on main, deploys to the VPS with Kamal 2.
# Settings and secrets live in the GitHub environment `production` (Settings → Environments);
# « Run workflow » on main redeploys them without a commit. See « Deployment » in the README.
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      proxy_reboot:
        description: "Reboot kamal-proxy with the proxy settings of config/deploy.yml instead of deploying (a few seconds of outage)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  deploy:
    needs: check
    # DEPLOY_ENABLED is a repository variable: the switch to stop deployments.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      # Public values (also inlined into the client bundle and visible in the public logs).
      NEXT_PUBLIC_BLOG_CONTRACT_ADDRESS: ${{ vars.NEXT_PUBLIC_BLOG_CONTRACT_ADDRESS }}
      NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID }}
      NEXT_PUBLIC_IPFS_GET_URL: ${{ vars.NEXT_PUBLIC_IPFS_GET_URL }}
      NEXT_PUBLIC_BLOCKCHAIN_EXPLORER_URL: ${{ vars.NEXT_PUBLIC_BLOCKCHAIN_EXPLORER_URL }}
      NEXT_PUBLIC_CHAIN_ID: ${{ vars.NEXT_PUBLIC_CHAIN_ID }}
      NEXT_PUBLIC_CHAINS: ${{ vars.NEXT_PUBLIC_CHAINS }}
      NEXT_IS_IPFS_PIN_ENABLED: ${{ vars.NEXT_IS_IPFS_PIN_ENABLED }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem install kamal -v 2.12.0 --no-document
      - name: Load the deploy key and trust the VPS host key
        env:
          KAMAL_SSH_KEY: ${{ secrets.KAMAL_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$KAMAL_SSH_KEY" | ssh-add - 2>/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
      - name: Start the IPFS node if missing, then build, send and switch to the new version
        if: ${{ !inputs.proxy_reboot }}
        env:
          NEXT_BLOCKCHAIN_RPC_URL: ${{ secrets.NEXT_BLOCKCHAIN_RPC_URL }}
        run: |
          kamal accessory boot ipfs
          kamal deploy
      - name: Reboot kamal-proxy with the proxy settings of config/deploy.yml
        if: ${{ inputs.proxy_reboot }}
        env:
          NEXT_BLOCKCHAIN_RPC_URL: ${{ secrets.NEXT_BLOCKCHAIN_RPC_URL }}
        run: kamal proxy reboot -y
      - name: Release the deploy lock if the run was cancelled
        if: cancelled()
        run: kamal lock release
